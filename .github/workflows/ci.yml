name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Registry (frontera de imports + schema)
        run: pnpm --filter @farma/registry check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build del paquete
        run: pnpm ui:build
      - name: Build de Storybook
        run: pnpm storybook:build
