name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm Trusted Publishing (OIDC) + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Trusted Publishing necesita npm >= 11.5.1
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Con changesets pendientes abre/actualiza el PR "Version Packages".
      # Al mergear ese PR (sin changesets pendientes) publica en npm sin token:
      # npm se autentica por OIDC con el Trusted Publisher configurado en npmjs.com.
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
